name: Deploy Backend to AWS Lightsail

on:
  push:
    branches:
      - main
    paths:
      - 'back/**'
      - '.github/workflows/deploy-backend.yml'
  # Corrida manual. `deploy: false` solo construye y empuja la imagen a ECR:
  # es como se sembró la primera imagen, antes de que existiera un deployment
  # del cual heredar las variables de entorno.
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Desplegar en Lightsail después de construir'
        type: boolean
        default: true

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: troqueles-back
  LIGHTSAIL_SERVICE: troqueles-api
  LIGHTSAIL_CONTAINER: back

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Mismas librerías de sistema que el Dockerfile instala para WeasyPrint:
    # sin esto, `import weasyprint` truena al generar los PDF de remisión.
    - name: Install system dependencies (WeasyPrint)
      run: |
        # Los repos de terceros preinstalados en el runner (Chrome, Microsoft)
        # rompen `apt-get update` cada tanto con "Hash Sum mismatch", y ninguno
        # aporta paquetes que este job necesite: se sacan antes de actualizar.
        # El glob cubre tanto el formato .list como el .sources (deb822), que es
        # el que usa la imagen actual del runner.
        sudo rm -f /etc/apt/sources.list.d/google-chrome.* \
                   /etc/apt/sources.list.d/microsoft-prod.*
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
          gobject-introspection libglib2.0-0 libcairo2 libgirepository-1.0-1 \
          fonts-dejavu-core fontconfig

    - name: Install Python dependencies
      working-directory: back
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run backend test suite
      working-directory: back
      run: python manage.py test

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Log in to Amazon ECR
      id: ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push backend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./back
        file: ./back/Dockerfile
        # El nodo de Lightsail es x86_64; los runners de GitHub también, pero
        # dejarlo explícito evita sorpresas si alguna vez se construye en arm.
        platforms: linux/amd64
        push: true
        tags: |
          ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Las ~20 variables de entorno de producción (SECRET_KEY, DB_*, IMAP,
    # Telegram, la connection string del Blob Storage) viven SOLO en Lightsail:
    # nunca pasan por GitHub. Por eso el deploy lee el spec del despliegue vivo
    # y le cambia únicamente la imagen.
    - name: Deploy to Lightsail
      if: github.event_name != 'workflow_dispatch' || inputs.deploy
      env:
        IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
      run: |
        set -euo pipefail

        aws lightsail get-container-service-deployments \
          --service-name "$LIGHTSAIL_SERVICE" \
          --query 'deployments[0]' > current.json

        if [ "$(jq -r 'type' current.json)" = "null" ]; then
          echo "El servicio $LIGHTSAIL_SERVICE no tiene ningún despliegue del cual heredar" \
               "las variables de entorno. Créalo una vez a mano (ver infra/aws/README.md)." >&2
          exit 1
        fi

        jq --arg svc "$LIGHTSAIL_SERVICE" \
           --arg name "$LIGHTSAIL_CONTAINER" \
           --arg img "$IMAGE" '
          {
            serviceName: $svc,
            containers: (.containers | .[$name].image = $img),
            publicEndpoint: {
              containerName: .publicEndpoint.containerName,
              containerPort: .publicEndpoint.containerPort,
              healthCheck: .publicEndpoint.healthCheck
            }
          }' current.json > deployment.json

        # Falla ruidosamente antes de desplegar si el spec heredado perdió las
        # variables de entorno: un deployment sin ellas arranca en sqlite.
        vars=$(jq --arg name "$LIGHTSAIL_CONTAINER" '.containers[$name].environment | length' deployment.json)
        echo "Variables de entorno heredadas: $vars"
        [ "$vars" -gt 0 ] || { echo "Spec sin variables de entorno; abortando." >&2; exit 1; }

        aws lightsail create-container-service-deployment --cli-input-json file://deployment.json \
          --query 'containerService.{state:state,version:currentDeployment.version}'

    - name: Wait for the deployment to become active
      if: github.event_name != 'workflow_dispatch' || inputs.deploy
      run: |
        set -euo pipefail
        for _ in $(seq 1 40); do
          state=$(aws lightsail get-container-service-deployments \
            --service-name "$LIGHTSAIL_SERVICE" --query 'deployments[0].state' --output text)
          echo "estado del despliegue: $state"
          case "$state" in
            ACTIVE) exit 0 ;;
            FAILED) echo "El despliegue falló; revisa los logs del contenedor." >&2; exit 1 ;;
          esac
          sleep 15
        done
        echo "El despliegue no quedó ACTIVE en 10 minutos." >&2
        exit 1
